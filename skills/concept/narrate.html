<section class="nar" id="nar" aria-label="Narration">
<audio id="narAudio" preload="auto" src="{{AUDIO}}"></audio>
<div class="nar-row">
<button id="narPlay" class="nar-play" data-skip>Play</button>
<button id="narPrev" class="nar-step" data-skip aria-label="Previous beat">&#8249;</button>
<button id="narNext" class="nar-step" data-skip aria-label="Next beat">&#8250;</button>
<div class="nar-head"><span><span id="narNo"></span><em id="narDid"></em></span><b id="narTitle"></b></div>
<span class="nar-time" id="narTime"></span>
</div>
<p class="nar-cap" id="narCap"></p>
<div class="nar-prog" id="narProg" aria-hidden="true"><i id="narFill"></i></div>
<p class="nar-note" id="narNote" hidden></p>
</section>
