<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
__DIAGRAMCSS__
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* header: title + quiet tools */
header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;line-height:1.25;font-weight:650;letter-spacing:-.01em;margin:0}
.lead{color:var(--mut);margin:4px 0 0;max-width:64ch}
.lead span{color:var(--faint);white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.tool:hover{border-color:var(--mut)}.tool.on{background:var(--wash);border-color:var(--acc);color:var(--ink)}
.toggle{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 12px;font-size:13.5px;line-height:1.5;color:var(--mut);cursor:pointer;user-select:none}
.toggle:hover{border-color:var(--mut)}
.toggle:has(input:checked){color:var(--ink)}
.toggle input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surf);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--acc)}.toggle input:checked::after{transform:translateX(12px)}
.toggle input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.toggle[hidden]{display:none}

/* stage = diagram + docked player bar */
.stage{background:var(--surf);border:1px solid var(--line);border-radius:14px;position:relative;--w:max(100%,min(var(--sw,100%),calc(100vw - 32px)));width:var(--w);margin-left:calc((100% - var(--w)) / 2);box-sizing:border-box}
.canvas{padding:14px 16px 10px}
/* the travelling item: a pill that rides the lit arrow */
.tok rect{fill:var(--c,var(--acc));rx:9}.tok text{fill:var(--onacc);font-size:11px;font-weight:650;text-anchor:middle;dominant-baseline:central}
.tok{pointer-events:none;transition:opacity .25s}.tok.off{opacity:0}
/* camera: the stage keeps one shape and the viewBox moves to frame what the voice names. A part appears when it is first named. */
svg.dia.cam{width:100%!important;max-width:none!important;aspect-ratio:var(--ar,16/9);max-height:68vh}
svg.dia.cam.phone{max-height:56vh}
/* a sequence keeps the names of its participants at the top of the frame, on a strip that hides the messages passing under it */
.camband{fill:var(--surf)}.sketch .camband{fill:var(--paper)}svg:not(.cam) .camband{display:none}
/* a box cut by the edge of the frame fades out; a side that sits on the edge of the whole diagram does not fade */
svg.cam{--ml:0%;--mr:0%;--mt:0%;--mb:0%;--fade:linear-gradient(90deg,transparent,#000 var(--ml),#000 calc(100% - var(--mr)),transparent),linear-gradient(transparent,#000 var(--mt),#000 calc(100% - var(--mb)),transparent);
 -webkit-mask-image:var(--fade);mask-image:var(--fade);-webkit-mask-composite:source-in;mask-composite:intersect}
svg.cam .node,svg.cam .elbl,svg.cam .grp,svg.cam .glbl,svg.cam .ske,svg.cam .skg,svg.cam .note{transition:opacity .45s}
svg.cam .edge{transition:stroke .3s,opacity .45s}
svg.cam .unseen,svg.cam .edge.unseen + .ske,svg.cam .grp.unseen + .skg{opacity:0}

.player{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--bar);border-radius:0 0 13px 13px}
.ibtn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--mut);cursor:pointer;flex:none}
.ibtn:hover{background:var(--done);color:var(--ink)}.ibtn svg{width:16px;height:16px;fill:currentColor}
.ibtn.main{width:40px;height:40px;background:var(--acc);color:var(--onacc)}.ibtn.main:hover{background:var(--acc);filter:brightness(1.08)}
.ibtn.main svg{width:18px;height:18px}
.prog{flex:1;height:22px;position:relative;cursor:pointer;min-width:60px}
.prog::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.prog i{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--acc)}
.prog b{position:absolute;top:7px;width:2px;height:8px;margin-left:-1px;background:var(--surf);border-radius:1px}
.t{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.rate{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:4px 6px;font-size:13px;cursor:pointer}

/* now playing */
.now{margin:22px 4px 0;display:grid;grid-template-columns:minmax(0,62ch) minmax(220px,300px);gap:28px;align-items:start;justify-content:space-between}
.now.noitem{grid-template-columns:minmax(0,66ch)}
.item{border:1px solid color-mix(in srgb,var(--c,var(--line)) 50%,var(--line));border-radius:12px;background:var(--surf);overflow:hidden}
.item header{all:unset;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--cw,var(--done));font-size:13px;font-weight:650;color:var(--ink)}
.item header i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc))}
.item header small{margin-left:auto;font-weight:500;color:var(--mut)}
.item dl{margin:0;padding:8px 12px 10px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.item dt{color:var(--faint)}.item dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.item.flash{animation:flash .5s ease-out}@keyframes flash{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--acc)) 45%,transparent)}to{box-shadow:none}}
@media (max-width:760px){.now{grid-template-columns:1fr}}
.stepno{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
/* a step's headline; the spoken sentence sits under it, one size smaller */
.ttl{font-size:21px;line-height:1.3;font-weight:650;letter-spacing:-.01em;margin:3px 0 0;text-wrap:balance}.ttl[hidden]{display:none}
.titled .cap{font-size:17px;margin-top:6px}
/* recap: one line a point; while the voice plays, a point appears when it is spoken */
.cap .pt{display:block;position:relative;padding-left:1.2em;margin-top:.35em;transition:opacity .3s}
.cap .pt::before{content:"";position:absolute;left:.25em;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cap.live .pt:not(.in){opacity:0}
/* a box's second line, replaced by "state": what the box holds now, in the box's colour */
.node .sub.live{fill:var(--c,var(--acc))}.node .sub.flash{animation:subin .5s ease-out}
@keyframes subin{from{opacity:0}to{opacity:1}}
.cap{font-size:19px;line-height:1.5;margin:4px 0 0;min-height:3em;text-wrap:pretty}
/* the caption lights word by word while the voice plays; a box's name takes the box's colour */
.cap .w{transition:color .12s}.cap .w.nm{color:var(--c)}
.cap.live .w:not(.sp){color:var(--faint)}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;color:var(--faint)}
.src code{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);background:var(--done);border-radius:6px;padding:5px 7px}

/* transcript */
.transcript{margin:26px 0 0;padding:0;list-style:none;max-width:72ch;border-top:1px solid var(--line)}
.transcript li{border-bottom:1px solid var(--line)}
.transcript button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.8em 1fr auto;gap:8px;align-items:baseline;width:100%;padding:9px 6px;cursor:pointer;color:var(--mut);font-size:14.5px}
.transcript .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transcript .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px}
.transcript button:hover{color:var(--ink)}
.transcript li.on button{color:var(--ink);box-shadow:inset 3px 0 var(--acc);padding-left:12px}
.transcript li.on .txt{white-space:normal}
.transcript li.past .n{color:var(--acc)}
.ask{font-size:12px;color:var(--acc);border:1px solid currentColor;border-radius:999px;padding:0 7px;line-height:18px;white-space:nowrap}
.quizzing .transcript{opacity:.35;pointer-events:none}.quizzing .now{display:none}@media (prefers-reduced-motion:reduce){.item.flash,.node .sub.flash{animation:none}}

/* predict + quiz card: directly under the player, never over the diagram */
.card{margin:14px 0 0;max-width:66ch;background:var(--surf);border:1.5px solid var(--acc);border-radius:12px;padding:14px 16px}
.card[hidden]{display:none}
.card h2{font-size:14px;font-weight:650;margin:0 0 4px;color:var(--acc)}
.card p{margin:0 0 12px}.card .ans{font-weight:600}
.card .row{display:flex;gap:8px}
.card button{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 14px;cursor:pointer}
.card button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.quiz .lbl,.quiz .sub{opacity:0}.quiz .node{cursor:pointer}.quiz .node:hover rect{stroke:var(--acc)}
.quiz .node.right .shape{fill:var(--wash);stroke:var(--acc);stroke-width:2.5}.quiz .node.right text{opacity:1}
.quiz .node.wrong .shape{fill:var(--badwash);stroke:var(--bad);stroke-width:2.5}.quiz .tok{display:none}
.sketch .quiz .node:hover .sko{stroke:var(--acc)}.sketch .quiz .node.right .shape,.sketch .quiz .node.wrong .shape{fill:transparent;stroke:transparent}
.sketch .quiz .node.right .skh{stroke:color-mix(in srgb,var(--acc) 60%,var(--paper))}.sketch .quiz .node.right .sko{stroke:var(--acc);stroke-width:2.6}
.sketch .quiz .node.wrong .skh{stroke:color-mix(in srgb,var(--bad) 55%,var(--paper))}.sketch .quiz .node.wrong .sko{stroke:var(--bad);stroke-width:2.6}
.sketch h1{font:400 26px/1.2 Hand,"Bradley Hand",cursive;letter-spacing:0}

footer{margin-top:22px;color:var(--faint);font-size:12.5px}
@media (max-width:640px){main{padding-top:18px}h1{font-size:19px}.cap{font-size:17px}.ttl{font-size:19px}.titled .cap{font-size:16px}.player{gap:4px;padding:8px 10px;position:sticky;bottom:0;z-index:2;box-shadow:0 -6px 16px rgba(0,0,0,.12)}.rate{display:none}}
@media (max-width:640px){.transcript .txt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.transcript li.on .txt{display:block}}
@media (prefers-reduced-motion:reduce){.edge.on{animation:none;stroke-dasharray:none}.node rect,.node text,.edge,.cap .w,.cap .pt,svg.cam .node,svg.cam .edge,svg.cam .elbl,svg.cam .grp,svg.cam .glbl,svg.cam .ske,svg.cam .skg,svg.cam .note{transition:none}}

 $('stepno').textContent=`Overview · ${NSTEPS} steps`;$('cap').textContent='The whole flow at once. Press play, or pick a step, to walk through it.';$('src').replaceChildren();

 if(anyItem){shownItem=undefined;$('item').hidden=false;$('now').classList.remove('noitem');$('item').className='item';$('iname').textContent='Nothing yet';$('iwhere').textContent='';$('ifields').replaceChildren()}
 syncCam();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function paint(i,c){if(cur[0]===i&&cur[1]===c)return;const stepChanged=cur[0]!==i;cur=[i,c];
 const now=lit(i,c),seenN=new Set(),seenE=new Set();
 const add=x=>{x.focus.forEach(n=>seenN.add(n));x.edges.forEach(e=>seenE.add(e))};

const SEQ=svgs.some(v=>v.classList.contains('seq')),cams=new Map();let camCut=true;

  ids:[...svg.querySelectorAll('.node')].filter(n=>{const q=n.querySelector('.shape').getBBox(),x=q.x+q.width/2,y=q.y+q.height/2;return x>b.x&&x<b.x+b.width&&y>b.y&&y<b.y+b.height}).map(n=>n.dataset.n)}});

 g.setAttribute('class','camhead');band.setAttribute('class','camband');[['x',F[0]-2000],['y',F[1]-2000],['width',F[2]+4000],['height',bot+8-F[1]+2000]].forEach(([k,v])=>band.setAttribute(k,v));

function showAll(){document.querySelectorAll('.unseen').forEach(x=>x.classList.remove('unseen'))}
function setVB(C){C.svg.setAttribute('viewBox',C.vb.map(v=>v.toFixed(1)).join(' '));if(C.head)C.head.setAttribute('transform',`translate(0,${Math.max(0,C.vb[1]-C.FULL[1]).toFixed(1)})`)}
// grow a frame to the shape of the stage, so the picture fills it
function fit(C,f){let[x,y,w,h]=f;const r=C.svg.getBoundingClientRect(),ar=r.width&&r.height?r.width/r.height:C.FULL[2]/C.FULL[3];
 if(w/h<ar){const nw=h*ar;x-=(nw-w)/2;w=nw}else{const nh=w/ar;y-=(nh-h)/2;h=nh}return[x,y,w,h]}
// keep a frame on the diagram: inside it where the diagram is larger, centred on it where the frame is larger
const hold=(p,len,lo,L)=>len>=L?lo-(len-L)/2:Math.min(Math.max(p,lo),lo+L-len);
function litBox(C,sel,keep){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;C.svg.querySelectorAll(sel).forEach(el=>{if(!keep(el))return;const b=el.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)});return x1<x0?null:[x0,y0,x1,y1]}
function frameFor(C,now){const F=C.FULL,ids=new Set(now.focus);now.edges.forEach(k=>k.includes('>')&&k.split('>').forEach(n=>ids.add(n)));
 const nb=litBox(C,'.node',n=>ids.has(n.dataset.n)),eb=litBox(C,'.edge,.elbl',e=>now.edges.includes(e.dataset.e));
 if(!nb&&!eb)return C.phone?null:fit(C,F);
 const all=[nb,eb].filter(Boolean),x0=Math.min(...all.map(b=>b[0])),y0=Math.min(...all.map(b=>b[1])),x1=Math.max(...all.map(b=>b[2])),y1=Math.max(...all.map(b=>b[3]));

 const r=C.svg.getBoundingClientRect(),P=48;let w=Math.max(x1-x0+2*P,r.width/1.2),h=Math.max(y1-y0+2*P,r.height/1.2),cx=(x0+x1)/2,cy=(y0+y1)/2;

 const mw=r.width/.75,mh=r.height/.75;if(w>mw||h>mh){const fb=litBox(C,'.node',n=>now.focus.includes(n.dataset.n));if(fb){cx=(fb[0]+fb[2])/2;cy=(fb[1]+fb[3])/2}w=Math.min(w,mw);h=Math.min(h,mh)}
 const f=fit(C,[cx-w/2,cy-h/2,w,h]),full=fit(C,F);if(!C.phone&&f[2]>=full[2]*.88)return full;
 f[0]=hold(f[0],f[2],F[0],F[2]);f[1]=hold(f[1],f[3],F[1],F[3]);return f}
// a sequence: the full width when it is readable, the lit message a little under the middle, the names pinned on top
function frameSeq(C,now){const F=C.FULL,mb=litBox(C,'.edge,.elbl',e=>now.edges.includes(e.dataset.e));if(!mb)return null;
 const r=C.svg.getBoundingClientRect(),ar=r.width/r.height,w=F[2]<=r.width/.75?Math.max(F[2],r.width/1.2):r.width/.9,h=w/ar;
 if(w>=F[2]&&h>=F[3]*.88)return fit(C,F);

 // a message wider than the frame: show the end it arrives at

 return[hold(x,w,F[0],F[2]),hold((mb[1]+mb[3])/2-.6*h,h,F[1],F[3]),w,h]}
function camTo(C,to,cut){if(!to)return;const goal=to.map(v=>v.toFixed(0)).join(' ');if(goal===C.goal&&!cut)return;C.goal=goal;cancelAnimationFrame(C.raf);
 // a box cut by the frame fades out; a side at the edge of the diagram, and the pinned names of a sequence, do not
 const F=C.FULL,m=on=>on?'5%':'0%';C.svg.style.setProperty('--ml',m(to[0]>F[0]+2));C.svg.style.setProperty('--mr',m(to[0]+to[2]<F[0]+F[2]-2));
 C.svg.style.setProperty('--mt',m(!C.head&&to[1]>F[1]+2));C.svg.style.setProperty('--mb',m(to[1]+to[3]<F[1]+F[3]-2));
 if(cut||camCut||RM){C.vb=to.slice();setVB(C);return}

  C.vb=from.map((v,j)=>v+(to[j]-v)*k);setVB(C);if(p<1)C.raf=requestAnimationFrame(step)})(st)}
function syncCam(cut){const use=$('cam').checked,wide=ov||quizOn||cur[0]<0,rc=!wide&&!!S[cur[0]].recap;

{const c0=store.get('cam');if(c0!==null)$('cam').checked=c0==='1';
