<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
__DIAGRAMCSS__
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* header: title + quiet tools */
header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;line-height:1.25;font-weight:650;letter-spacing:-.01em;margin:0}
.lead{color:var(--mut);margin:4px 0 0;max-width:64ch}
.lead span{color:var(--faint);white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.tool:hover{border-color:var(--mut)}.tool.on{background:var(--wash);border-color:var(--acc);color:var(--ink)}
.toggle{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 12px;font-size:13.5px;line-height:1.5;color:var(--mut);cursor:pointer;user-select:none}
.toggle:hover{border-color:var(--mut)}
.toggle:has(input:checked){color:var(--ink)}
.toggle input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surf);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--acc)}.toggle input:checked::after{transform:translateX(12px)}
.toggle input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* stage = diagram + docked player bar */
.stage{background:var(--surf);border:1px solid var(--line);border-radius:14px;position:relative;--w:max(100%,min(var(--sw,100%),calc(100vw - 32px)));width:var(--w);margin-left:calc((100% - var(--w)) / 2);box-sizing:border-box}
.canvas{padding:14px 16px 10px}
/* the travelling item: a pill that rides the lit arrow */
.tok rect{fill:var(--c,var(--acc));rx:9}.tok text{fill:var(--onacc);font-size:11px;font-weight:650;text-anchor:middle;dominant-baseline:central}
.tok{pointer-events:none;transition:opacity .25s}.tok.off{opacity:0}

.player{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--bar);border-radius:0 0 13px 13px}
.ibtn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--mut);cursor:pointer;flex:none}
.ibtn:hover{background:var(--done);color:var(--ink)}.ibtn svg{width:16px;height:16px;fill:currentColor}
.ibtn.main{width:40px;height:40px;background:var(--acc);color:var(--onacc)}.ibtn.main:hover{background:var(--acc);filter:brightness(1.08)}
.ibtn.main svg{width:18px;height:18px}
.prog{flex:1;height:22px;position:relative;cursor:pointer;min-width:60px}
.prog::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.prog i{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--acc)}
.prog b{position:absolute;top:7px;width:2px;height:8px;margin-left:-1px;background:var(--surf);border-radius:1px}
.t{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.rate{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:4px 6px;font-size:13px;cursor:pointer}

/* now playing */
.now{margin:22px 4px 0;display:grid;grid-template-columns:minmax(0,62ch) minmax(220px,300px);gap:28px;align-items:start;justify-content:space-between}
.now.noitem{grid-template-columns:minmax(0,66ch)}
.item{border:1px solid color-mix(in srgb,var(--c,var(--line)) 50%,var(--line));border-radius:12px;background:var(--surf);overflow:hidden}
.item header{all:unset;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--cw,var(--done));font-size:13px;font-weight:650;color:var(--ink)}
.item header i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc))}
.item header small{margin-left:auto;font-weight:500;color:var(--mut)}
.item dl{margin:0;padding:8px 12px 10px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.item dt{color:var(--faint)}.item dd{margin:0;color:var(--ink);overflow-wrap:anywhere}

.stepno{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.cap{font-size:19px;line-height:1.5;margin:4px 0 0;min-height:3em;text-wrap:pretty}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;color:var(--faint)}
.src code{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);background:var(--done);border-radius:6px;padding:5px 7px}

/* transcript */
.transcript{margin:26px 0 0;padding:0;list-style:none;max-width:72ch;border-top:1px solid var(--line)}
.transcript li{border-bottom:1px solid var(--line)}
.transcript button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.8em 1fr auto;gap:8px;align-items:baseline;width:100%;padding:9px 6px;cursor:pointer;color:var(--mut);font-size:14.5px}
.transcript .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transcript .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px}
.transcript button:hover{color:var(--ink)}
.transcript li.on button{color:var(--ink);box-shadow:inset 3px 0 var(--acc);padding-left:12px}
.transcript li.on .txt{white-space:normal}
.transcript li.past .n{color:var(--acc)}
.ask{font-size:12px;color:var(--acc);border:1px solid currentColor;border-radius:999px;padding:0 7px;line-height:18px;white-space:nowrap}
.quizzing .transcript{opacity:.35;pointer-events:none}.quizzing .now{display:none}@media (prefers-reduced-motion:reduce){.item.flash{animation:none}}

/* predict + quiz card: directly under the player, never over the diagram */
.card{margin:14px 0 0;max-width:66ch;background:var(--surf);border:1.5px solid var(--acc);border-radius:12px;padding:14px 16px}
.card[hidden]{display:none}
.card h2{font-size:14px;font-weight:650;margin:0 0 4px;color:var(--acc)}
.card p{margin:0 0 12px}.card .ans{font-weight:600}
.card .row{display:flex;gap:8px}
.card button{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 14px;cursor:pointer}
.card button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.quiz .lbl,.quiz .sub{opacity:0}.quiz .node{cursor:pointer}.quiz .node:hover rect{stroke:var(--acc)}
.quiz .node.right .shape{fill:var(--wash);stroke:var(--acc);stroke-width:2.5}.quiz .node.right text{opacity:1}
.quiz .node.wrong .shape{fill:var(--badwash);stroke:var(--bad);stroke-width:2.5}.quiz .tok{display:none}
.sketch .quiz .node:hover .sko{stroke:var(--acc)}.sketch .quiz .node.right .shape,.sketch .quiz .node.wrong .shape{fill:transparent;stroke:transparent}
.sketch .quiz .node.right .skh{stroke:color-mix(in srgb,var(--acc) 60%,var(--paper))}.sketch .quiz .node.right .sko{stroke:var(--acc);stroke-width:2.6}
.sketch .quiz .node.wrong .skh{stroke:color-mix(in srgb,var(--bad) 55%,var(--paper))}.sketch .quiz .node.wrong .sko{stroke:var(--bad);stroke-width:2.6}
.sketch h1{font:400 26px/1.2 Hand,"Bradley Hand",cursive;letter-spacing:0}

footer{margin-top:22px;color:var(--faint);font-size:12.5px}
@media (max-width:640px){main{padding-top:18px}h1{font-size:19px}.cap{font-size:17px}.player{gap:4px;padding:8px 10px;position:sticky;bottom:0;z-index:2;box-shadow:0 -6px 16px rgba(0,0,0,.12)}.rate{display:none}}
@media (max-width:640px){.transcript .txt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.transcript li.on .txt{display:block}}
@media (prefers-reduced-motion:reduce){.edge.on{animation:none;stroke-dasharray:none}.node rect,.node text,.edge{transition:none}}

</div>

 buttons.forEach(([t,f,primary])=>{const b=document.createElement('button');b.textContent=t;if(primary)b.className='primary';b.onclick=f;$('cardb').appendChild(b)});$('card').hidden=false;$('cardb').firstChild&&$('cardb').firstChild.focus({preventScroll:true})}
function hideCard(){$('card').hidden=true}
function askCard(i){card('Predict, then check',S[i].ask.q,S[i].ask.a,[['Show answer',()=>{$('carda').hidden=false;$('cardb').firstChild.remove();$('cardb').firstChild.className='primary';$('cardb').firstChild.focus({preventScroll:true})},true],['Continue',()=>{hideCard();a.play()}]])}
// ---- recall quiz: labels hidden, click where each step happens
let quizOn=false,qi=0,score=0,qsteps=[];const svgs=[...document.querySelectorAll('svg.dia')];
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),maskWords=[...D.labels,...D.labels.flatMap(l=>l.split(/\s+/)).filter(w=>w.length>=2&&/^[A-Z0-9]/.test(w))];
const mask=t=>maskWords.reduce((s,w)=>s.replace(new RegExp('(^|[^\\w▢])'+esc(w)+'(?![\\w])','gi'),'$1▢▢▢'),t);
function startQuiz(){a.pause();quizOn=true;document.body.classList.add('quizzing');$('quiz').classList.add('on');
 nodes.forEach(n=>{n.setAttribute('tabindex','0');n.setAttribute('role','button');n.setAttribute('aria-label','Diagram box')});qi=0;score=0;qsteps=S.map((s,i)=>i).filter(i=>S[i].focus.length);svgs.forEach(s=>s.classList.add('quiz'));
 nodes.forEach(n=>n.classList.remove('on','done'));edges.forEach(e=>e.classList.remove('on','done'));$('quiz').textContent='End test';askQ()}
let answered=false;
function askQ(){answered=false;nodes.forEach(n=>n.classList.remove('right','wrong'));if(qi>=qsteps.length)return quizDone();const i=qsteps[qi];
 card(`Where does this happen? ${qi+1} of ${qsteps.length}`,mask(S[i].caption),'',[['Skip',()=>{qi++;askQ()}],['End test',endQuiz]])}
function answer(id){const i=qsteps[qi];if(!quizOn||answered||i===undefined)return;answered=true;const ok=S[i].focus.includes(id);if(ok)score++;
 nodes.forEach(n=>{if(S[i].focus.includes(n.dataset.n))n.classList.add('right');else if(n.dataset.n===id)n.classList.add('wrong')});
 card(ok?'Right':'Not quite',S[i].caption,'',[['Next',()=>{qi++;askQ()},true]])}
function quizDone(){const best=Math.max(score,+(store.get('best:'+D.title)||0));store.set('best:'+D.title,best);
 card('Done',`You placed ${score} of ${qsteps.length} steps. Your best: ${best} of ${qsteps.length}.`,'',[['Try again',startQuiz,true],['Close',endQuiz]])}
function endQuiz(){quizOn=false;document.body.classList.remove('quizzing');$('quiz').classList.remove('on');nodes.forEach(n=>{n.removeAttribute('tabindex');n.removeAttribute('role');n.removeAttribute('aria-label')});svgs.forEach(s=>s.classList.remove('quiz'));nodes.forEach(n=>n.classList.remove('right','wrong'));hideCard();$('quiz').textContent='Test me';cur=[-1,-1];paint(...stateAt(a.currentTime))}
nodes.forEach(n=>n.addEventListener('click',()=>quizOn&&answer(n.dataset.n)));
$('quiz').onclick=()=>quizOn?endQuiz():startQuiz();
if(!S.some(s=>s.ask))$('predictWrap').hidden=true;
const pv=store.get('predict');if(pv!==null)$('predict').checked=pv==='1';$('predict').onchange=e=>store.set('predict',e.target.checked?'1':'0');
// ---- notes export
$('notes').onclick=async()=>{const md=[`# ${D.title}`,D.lead?`\n${D.lead}\n`:'',...S.map((s,i)=>`${i+1}. ${s.caption}${s.src.length?`  \n   Code: \`${s.src.join('`, `')}\``:''}${s.ask?`  \n   - Q: ${s.ask.q}  \n   - A: ${s.ask.a}`:''}`),
 M.sha?`\nBuilt from ${M.repo}@${M.sha} on ${M.built}.`:''].join('\n');
 try{await navigator.clipboard.writeText(md)}catch(e){const t=document.createElement('textarea');t.value=md;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
 $('notes').textContent='Copied';setTimeout(()=>$('notes').textContent='Copy as notes',1500)};
// ---- image export: the diagram as it looks now, as a PNG with the page's styles inlined
function diagramSvg(){
 const src=[...document.querySelectorAll('svg.dia')].find(v=>v.getClientRects().length)||document.querySelector('svg.dia');
 const vb=src.viewBox.baseVal,svg=src.cloneNode(true),k=2;
 svg.setAttribute('xmlns',NS);svg.setAttribute('width',vb.width*k);svg.setAttribute('height',vb.height*k);
 svg.setAttribute('style',`font-family:${getComputedStyle(src).fontFamily}`);svg.classList.remove('desk','phone','quiz');svg.classList.add(...document.body.classList);
 // freeze light or dark: in an image, prefers-color-scheme may not match the page
 svg.setAttribute('data-theme',document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
 const css=[...document.styleSheets].flatMap(sh=>{try{return [...sh.cssRules].map(r=>r.cssText)}catch(e){return []}}).join('\n');
 const st=document.createElementNS(NS,'style');st.textContent=css;
 const bg=document.createElementNS(NS,'rect');
 for(const [n,v] of [['x',vb.x],['y',vb.y],['width',vb.width],['height',vb.height]])bg.setAttribute(n,v);
 bg.setAttribute('fill',getComputedStyle($('stage')).backgroundColor);
 svg.prepend(st,bg);
 return {text:new XMLSerializer().serializeToString(svg),w:vb.width*k,h:vb.height*k};
}
async function diagramPng(){
 const {text,w,h}=diagramSvg(),img=new Image();
 await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(text)});
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
 return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('no image')),'image/png'));
}
const imgName=()=>(D.title||'diagram').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function save(blob,ext){const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=`${imgName()}.${ext}`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function flash(id,msg,back){$(id).textContent=msg;setTimeout(()=>$(id).textContent=back,1800)}
$('imgsave').onclick=async()=>{
 // a browser that will not draw the SVG onto a canvas still gets the vector file
 try{save(await diagramPng(),'png')}catch(e){save(new Blob([diagramSvg().text],{type:'image/svg+xml'}),'svg')}};
$('imgcopy').onclick=async()=>{
 try{await navigator.clipboard.write([new ClipboardItem({'image/png':diagramPng()})]);flash('imgcopy','Copied','Copy image')}
 catch(e){$('imgsave').onclick();flash('imgcopy','Saved instead','Copy image')}};
$('foot').textContent=M.sha?`Built from ${M.repo} at ${M.sha} on ${M.built}.`:`Built on ${M.built}.`;
// ---- self-test for the agent: window.__nw.selftest()
// a sequence on a phone scrolls sideways: keep the lit message (or box) in view
function follow(instant){const svg=visibleSvg();if(!svg||!svg.classList.contains('seq'))return;const box=svg.parentElement;if(box.scrollWidth<=box.clientWidth)return;
 const el=svg.querySelector('.edge.on')||svg.querySelector('.node.on');if(!el)return;const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();
 box.scrollTo({left:box.scrollLeft+r.left+r.width/2-b.left-b.width/2,behavior:instant||matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
// the first paint runs before the hand font and layout settle: follow again once they have
addEventListener('load',()=>(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>follow(true)));
function visibleSvg(){return svgs.find(s=>getComputedStyle(s).display!=='none')}
const overlap=(b,c)=>b.x<c.x+c.width-1&&c.x<b.x+b.width-1&&b.y<c.y+c.height-1&&c.y<b.y+b.height-1;
window.__nw={version:M.version,seconds:M.seconds,steps:S.length,selftest(){const out={ok:true,problems:[],duration:a.duration,steps:[]};
 if(a.duration&&Math.abs(a.duration-M.seconds)>0.5)out.problems.push(`audio ${a.duration}s vs built ${M.seconds}s`);
 const svg=visibleSvg(),nd=[...svg.querySelectorAll('.node')];
 S.forEach((s,i)=>{paint(i,-1);const st={step:i+1,lit:nd.filter(n=>n.classList.contains('on')).map(n=>n.dataset.n),cues:[]};
  if(s.focus.length&&!st.lit.length)out.problems.push(`step ${i+1} lights nothing`);
  s.cues.forEach((q,k)=>{paint(i,k);st.cues.push(nd.filter(n=>n.classList.contains('on')).map(n=>n.dataset.n))});out.steps.push(st)});
 const boxes=nd.map(n=>({id:n.dataset.n,b:n.querySelector('.shape').getBBox()}));
 svg.querySelectorAll('.edge').forEach(e=>{const [f,t]=e.dataset.e.split('>'),L=e.getTotalLength();
  for(let k=1;k<30;k++){const p=e.getPointAtLength(L*k/30);const hit=boxes.find(x=>x.id!==f&&x.id!==t&&p.x>x.b.x+2&&p.x<x.b.x+x.b.width-2&&p.y>x.b.y+2&&p.y<x.b.y+x.b.height-2);
   if(hit){out.problems.push(`edge ${e.dataset.e} crosses ${hit.id}`);break}}});
 // two arrows that share no box but run parallel and close read as one line (the build's side_by_side, on the drawn paths)
 if(!svg.classList.contains('seq')){const es=[...svg.querySelectorAll('.edge')].map(e=>{const L=e.getTotalLength(),n=Math.max(2,Math.ceil(L/4));
   return{k:e.dataset.e,ends:e.dataset.e.split('>'),p:Array.from({length:n+1},(_,j)=>e.getPointAtLength(L*j/n))}});
  es.forEach((x,i)=>es.slice(i+1).forEach(y=>{if(x.ends.some(v=>y.ends.includes(v)))return;let run=0,best=0;
   for(let j=1;j<x.p.length;j++){const q=x.p[j],pq=x.p[j-1],ax=q.x-pq.x,ay=q.y-pq.y;let m=0,bd=1e9;
    y.p.forEach((r,w)=>{const d=Math.hypot(q.x-r.x,q.y-r.y);if(d<bd){bd=d;m=w}});
    const r=y.p[Math.max(1,m)],pr=y.p[Math.max(1,m)-1],bx=r.x-pr.x,by=r.y-pr.y,nn=Math.hypot(ax,ay)*Math.hypot(bx,by);
    if(bd<16&&nn>0&&Math.abs(ax*by-ay*bx)/nn<0.26){run+=Math.hypot(ax,ay);best=Math.max(best,run)}else run=0}
   if(best>20)out.problems.push(`edges ${x.k} and ${y.k} run side by side`)}))}
 nd.forEach(n=>{const w=n.querySelector('.shape').getBBox().width;n.querySelectorAll('text').forEach(t=>{if(t.getComputedTextLength()>w-8)out.problems.push(`text "${t.textContent}" overflows ${n.dataset.n}`)})});
 const tl=[...svg.querySelectorAll('.glbl,.elbl')].filter(t=>getComputedStyle(t).opacity!=='0').map(t=>({t:t.textContent,b:t.getBBox()}));
 tl.forEach((p,i)=>tl.slice(i+1).forEach(q=>{if(overlap(p.b,q.b))out.problems.push(`labels "${p.t}" and "${q.t}" overlap`)}));
 tl.forEach(p=>boxes.forEach(x=>{if(overlap(p.b,x.b))out.problems.push(`label "${p.t}" overlaps box ${x.id}`)}));
 const fs=parseFloat(getComputedStyle(svg.querySelector('.lbl')).fontSize)*svg.getBoundingClientRect().width/svg.viewBox.baseVal.width;
 if(fs<10)out.problems.push(`labels render at ${fs.toFixed(1)}px`);out.labelPx=+fs.toFixed(1);
 cur=[-1,-1];paint(...stateAt(a.currentTime));out.ok=!out.problems.length;return out}};
// ---- start at #n
const h=parseInt(location.hash.slice(1));if(h>=1&&h<=S.length)paint(...stateAt(S[h-1].t));else overview();
if(h>=1&&h<=S.length){if(a.readyState>=1)go(h-1,false);else a.addEventListener('loadedmetadata',()=>go(h-1,false),{once:true})}
</script></body></html>
